[project]
name = "telegram-news-bridge"
version = "0.1.0"
description = "Telethon bridge: news feed, WebSocket push, publish, Ollama/OpenAI rewrite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "telethon>=1.34.0",
  "python-dotenv>=1.0.0",
  "PyJWT>=2.9.0",
  "httpx>=0.27.0",
]

[project.scripts]
telegram-news-bridge = "telegram_news_bridge.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
