[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transcript-skill"
version = "0.4.39"
description = "Transcribe YouTube captions, Apple Podcasts, or local media via faster-whisper (JSON out)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "youtube-transcript-api>=1.0.0",
  "faster-whisper",
  "yt-dlp",
  "psutil>=5.9.0",
  "rich>=13.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
diarize = ["pyannote.audio>=3.1.0"]

[project.scripts]
transcript-media = "transcript_skill.cli:main"
download-whisper-weights = "transcript_skill.download_weights:main"

[tool.hatch.build.targets.wheel]
packages = ["src/transcript_skill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
