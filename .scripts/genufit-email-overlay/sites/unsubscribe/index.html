<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Unsubscribe from GenuFit waitlist emails. Enter your email to confirm — no instant one-click unsubscribe."
    />
    <meta name="unsubscribe-api-base" content="" />
    <title>Unsubscribe — GenuFit waitlist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/unsubscribe/unsubscribe.css" />
  </head>
  <body>
    <main class="card">
      <p class="eyebrow">GenuFit waitlist</p>
      <h1>Unsubscribe</h1>
      <p class="lead">
        Enter the email you used for the waitlist. We only remove you after you submit this form —
        clicking Unsubscribe in an email just opens this page.
      </p>
      <form id="unsubscribe-form" novalidate>
        <input
          type="text"
          name="website"
          class="hp"
          tabindex="-1"
          autocomplete="off"
          aria-hidden="true"
        />
        <label for="email">Email address</label>
        <input id="email" name="email" type="email" autocomplete="email" required placeholder="you@company.com" />
        <button type="submit">Confirm unsubscribe</button>
        <p id="unsubscribe-message" class="message" role="status" aria-live="polite"></p>
      </form>
      <a class="back-link" href="https://genufit.app/">Back to genufit.app</a>
    </main>
    <script src="/unsubscribe/unsubscribe.js"></script>
  </body>
</html>
