# Реестр рассылок личного Gmail → метки Dex/Feeds/<имя> (левое меню).
# Bootstrap: npm run email:newsletters-bootstrap

parent_label: Dex/Feeds

service_labels:
  action: Dex/Action
  job: Dex/Job
  receipts: Dex/Receipts
  read_ai: Dex/Read-AI

# Приоритетное чтение (не Action): AI / продукт / обучение. Финансы и недвижимость сюда не кладём.
read_ai_queries:
  - id: read-ai-substack
    query: from:substack.com
  - id: read-ai-beehiiv
    query: from:beehiiv
  - id: read-ai-maven
    query: from:courses.maven.com
  - id: read-ai-gopractice
    query: from:gopractice
  - id: read-ai-productschool
    query: from:productschool.com
  - id: read-ai-anthropic
    query: from:anthropic.com
  - id: read-ai-cerebralvalley
    query: from:cerebralvalley.ai
  - id: read-ai-innovating
    query: from:innovatingwithai.com
  - id: read-ai-ideabrowser
    query: from:ideabrowser.com
  - id: read-ai-posthog
    query: from:posthog.com
  - id: read-ai-similarweb
    query: from:similarweb.com
  - id: read-ai-claude
    query: from:claude.com
  - id: read-ai-linkedin-digest
    query: 'from:linkedin.com from:newsletters-noreply -from:jobalerts-noreply'
  - id: read-ai-authority
    query: from:authority-figures.com
  - id: read-ai-subject-ai
    query: 'subject:(AI OR Claude OR ChatGPT OR LLM OR "machine learning" OR Anthropic OR OpenAI) -from:interactivebrokers.com -from:kucoin -from:okx.com -from:bitfinex -from:kyero.com -from:jobalerts-noreply -from:jobs-noreply -label:Dex/Job'

service_filters:
  - id: calendar-notifications
    label: Dex/Feeds/_Calendar
    query: 'from:google.com subject:Notification'
    skip_inbox: false
    mark_read: true
  - id: action-linkedin-messages
    label: Dex/Action
    query: 'from:linkedin.com (subject:"Message replied" OR subject:"messaged you" OR subject:"just messaged" OR from:hit-reply OR from:messaging-digest OR from:inmail-hit-reply) -from:newsletters-noreply -from:invitations@linkedin.com -subject:"You have an invitation"'
    skip_inbox: false
    mark_read: false
  - id: action-interviews
    label: Dex/Action
    query: 'subject:(interview OR "application received" OR "job offer") -from:linkedin.com -from:google.com -from:todoist.com -from:substack.com -from:beehiiv -from:udemy -subject:Notification -subject:"How to Crack" -category:promotions'
    skip_inbox: false
    mark_read: false
  - id: job-linkedin-alerts
    label: Dex/Job
    query: 'from:linkedin.com (jobs OR "job alert" OR recommended OR newsletters-noreply OR subject:invitation)'
    skip_inbox: true
    mark_read: false
  - id: job-thank-you
    label: Dex/Job
    query: 'subject:("thank you for applying" OR "thank you for your interest" OR "application received") -from:substack.com -category:promotions'
    skip_inbox: true
    mark_read: false
  - id: job-ats-alerts
    label: Dex/Job
    query: 'subject:("New jobs posted" OR "is hiring" OR "are hiring") OR from:jobs2web.com OR from:glassdoor.com OR from:survale.com'
    skip_inbox: true
    mark_read: false
  - id: job-direct-recruiter
    label: Dex/Action
    query: 'from:helpmeetjob.com OR from:toogeza.tech OR (subject:(ваканс OR vacancy) -from:linkedin.com -from:glassdoor.com -from:udemy -category:promotions)'
    skip_inbox: false
    mark_read: false
  - id: receipts-shopping
    label: Dex/Receipts
    query: 'from:(amazon.com OR miio OR comparaja.pt OR apple.com OR fnac.pt)'
    skip_inbox: true
    mark_read: false
  - id: gov-finance
    label: Dex/Receipts
    query: 'from:at.gov.pt OR subject:"Portal das Finanças"'
    skip_inbox: false
    mark_read: false
  - id: security-noise
    label: Dex/Feeds/_Security-Noise
    query: 'subject:(security OR payment OR sign-in OR "signed in" OR "new login" OR "verification code") -from:google.com'
    skip_inbox: true
    mark_read: true
    also_label_parent: true

