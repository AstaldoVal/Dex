name: Deploy GenuFit waitlist to Pages

on:
  push:
    branches:
      - main
      - 'cursor/**'
    paths:
      - '.scripts/genufit-waitlist-overlay/**'
      - '.github/workflows/genufit-waitlist-pages.yml'

jobs:
  deploy:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Deploy waitlist overlay to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run genufit:waitlist-pages-deploy
